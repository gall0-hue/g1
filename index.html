<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>カラーパレット</title>
<style>
:root{font-family:Inter,"Noto Sans JP",system-ui,sans-serif;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;background:transparent;color:light-dark(#24272c,#f3f3f3)}
.palette{width:100%;max-width:680px;padding:5px 4px 9px;margin:0 auto}
.item{display:flex;align-items:center;gap:11px;min-height:49px;border-bottom:1px solid light-dark(#e9e9e9,#363636);padding:7px 5px}
.swatch{width:25px;height:25px;border-radius:6px;flex:none;border:1px solid #7774}
.label{flex:1;min-width:0}.hex{font:600 13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;user-select:text;cursor:text}.name{font-size:11px;color:light-dark(#777,#aaa)}
.copy{border:1px solid light-dark(#dedede,#555);background:light-dark(#fff,#292929);color:inherit;border-radius:7px;min-height:30px;padding:4px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.copy:hover{background:light-dark(#f3f3f3,#393939)}.copy:focus-visible{outline:2px solid #648df5;outline-offset:2px}
.status{position:absolute;left:-9999px}
</style>
</head>
<body>
<main class="palette" id="palette" aria-label="カラーコード一覧"></main>
<div class="status" id="status" aria-live="polite"></div>
<script>
// ここを書き換えると、表示する色・名前・順番を変更できます。
const colors = [
  { hex: '#E8A0BF', name: 'ピンク' },
  { hex: '#7089C2', name: 'ブルー' },
  { hex: '#30343F', name: 'チャコール' },
  { hex: '#E5D8C5', name: 'ベージュ' },
];

const palette = document.getElementById('palette');
const status = document.getElementById('status');
function validHex(v) { return /^#[0-9a-fA-F]{6}$/.test(v); }
async function copyText(value) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
      return true;
    }
  } catch (_) {}
  // 埋め込み環境などでClipboard APIが使えない場合の代替手段。
  const el = document.createElement('textarea');
  el.value = value; el.setAttribute('readonly','');
  el.style.cssText='position:fixed;left:-10000px;top:0;';
  document.body.appendChild(el); el.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) {}
  el.remove(); return ok;
}
for (const entry of colors) {
  const hex = String(entry.hex).trim().toUpperCase();
  if (!validHex(hex)) continue;
  const row = document.createElement('div'); row.className='item';
  const swatch=document.createElement('span');swatch.className='swatch';swatch.style.backgroundColor=hex;swatch.setAttribute('aria-label',hex+'の色見本');swatch.setAttribute('role','img');
  const label=document.createElement('div');label.className='label';
  const code=document.createElement('div');code.className='hex';code.textContent=hex;
  const name=document.createElement('div');name.className='name';name.textContent=entry.name||'';
  label.append(code,name);
  const button=document.createElement('button');button.className='copy';button.type='button';button.textContent='コピー';button.setAttribute('aria-label',hex+'をコピー');
  button.addEventListener('click',async()=>{
    const success=await copyText(hex);
    status.textContent=success?hex+'をコピーしました': 'コピーできませんでした。カラーコードの文字を選択してコピーしてください。';
    button.textContent=success?'コピー済み':'選択してコピー';
    button.setAttribute('aria-label',status.textContent);
  });
  row.append(swatch,label,button);palette.append(row);
}
</script>
</body>
</html>
